swagger: "2.0"

info:
  title: "Test circular references"
  version: "1.0"

basePath: /v1.0

paths:
  /owners:
    get:
      description: Return a list of all registered owners
      operationId: simple_app.get_owners
      responses:
        '200':
          description: A list of owners
          schema:
            type: array
            items:
              $ref: "#/definitions/owner"

definitions:
  owner:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      widgets:
        type: array
        items:
          $ref: "#/definitions/widget"
  widget:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      owners:
        type: array
        items:
          $ref: "#/definitions/owner"
